name: Build Windows EXE

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name FapiaoHelper main.py --collect-all rapidocr_onnxruntime --hidden-import pdfplumber --hidden-import openpyxl

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: FapiaoHelper-windows-exe
          path: dist/FapiaoHelper.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-exe
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download exe artifact
        uses: actions/download-artifact@v4
        with:
          name: FapiaoHelper-windows-exe
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/FapiaoHelper.exe
          generate_release_notes: true
          body: |
            该版本由 GitHub Actions 自动打包生成（Windows EXE）。
            Workflow: ${{ github.workflow }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
