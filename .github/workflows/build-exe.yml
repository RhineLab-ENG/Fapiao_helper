name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name FapiaoHelper main.py --collect-all rapidocr_onnxruntime --hidden-import pdfplumber --hidden-import openpyxl

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: FapiaoHelper-windows-exe
          path: dist/FapiaoHelper.exe
          if-no-files-found: error
